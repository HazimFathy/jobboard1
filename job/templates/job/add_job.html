{% extends 'base.html' %}
{% load bootstrap4 %}

{% block body %}

<!-- bradcam_area  -->
<div class="bradcam_area bradcam_bg_1">
    <div class="container">
        <div class="row">
            <div class="col-xl-12 text-center">
                <div class="bradcam_text">
                    <h3 class="text-white display-4">Add a New Job</h3>
                </div>
            </div>
        </div>
    </div>
</div>
<!--/ bradcam_area  -->

<div class="job_details_area">
    <div class="container">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="apply_job_form white-bg p-5 shadow-lg rounded-lg" style="background: linear-gradient(135deg, #f9f9f9, #ffffff); border: 1px solid #e0e0e0;">
                    <h4 class="mb-4 text-center" style="color: #333; font-weight: 600;">Add a New Job</h4>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <!-- Job Form -->
                        <div class="mb-4">
                            {% bootstrap_form form %}
                        </div>
                        <!-- Submit Button -->
                        {% buttons %}
                            <button class="boxed-btn3 w-100 mt-4" type="submit" style="background: #28a745; color: #fff; border: none; padding: 12px; font-size: 16px; border-radius: 8px; transition: background 0.3s ease;">
                                ADD NOW
                            </button>
                        {% endbuttons %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Custom CSS for Hover Effects -->
<style>
    .boxed-btn3:hover {
        opacity: 0.9;
        transform: scale(1.02);
    }
    .apply_job_form {
        transition: box-shadow 0.3s ease;
    }
    .apply_job_form:hover {
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }
</style>

{% endblock body %}
